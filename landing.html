<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERLC Community | El Estándar del Roleplay</title>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-void: #0b0c0e;
            --color-abyss: #0e111b;
            --color-deep-sea: #0d172b;
            --color-cobalt-panel: #12244f;
            --color-signal-blue: #2862d7;
            --color-quartz: #ffffff;
            --color-ash: #abaebb;
            --color-obsidian-edge: #172540;
            --aurora-purple: radial-gradient(79% 95% at 38% -53%, rgba(98, 95, 255, 0.38) 0px, rgba(0, 0, 0, 0));
            --plasma-pink: radial-gradient(28% 22% at 72% 103%, rgba(255, 125, 218, 0.33) 0px, rgba(0, 0, 0, 0));
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--color-void);
            color: var(--color-quartz);
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Fondos Aurora */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: var(--color-void);
        }
        .glow-1 { position: absolute; width: 100%; height: 100%; background: var(--aurora-purple); }
        .glow-2 { position: absolute; width: 100%; height: 100%; background: var(--plasma-pink); }

        /* Navegación */
        nav {
            position: sticky; top: 0; height: 64px;
            background: rgba(11, 12, 14, 0.8);
            backdrop-filter: blur(12px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 5%; z-index: 100;
            border-bottom: 1px solid var(--color-obsidian-edge);
        }

        .logo { font-family: 'Figtree', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: -0.02em; }
        .nav-links a { color: var(--color-ash); text-decoration: none; margin-left: 25px; font-size: 14px; transition: 0.3s; }
        .nav-links a:hover { color: var(--color-quartz); }

        /* Hero Section */
        .hero {
            height: 90vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; padding: 0 20px;
        }

        .hero h1 {
            font-family: 'Figtree', sans-serif; font-size: 64px; font-weight: 500;
            letter-spacing: -1.28px; margin-bottom: 20px; line-height: 1.1;
        }

        .hero p { color: var(--color-ash); font-size: 18px; max-width: 600px; margin-bottom: 40px; line-height: 1.5; }

        /* Botones AgentQL */
        .btn-primary {
            background: var(--color-quartz); color: #050606;
            padding: 12px 24px; border-radius: 9999px;
            text-decoration: none; font-weight: 500; font-size: 15px; transition: 0.3s;
        }
        .btn-primary:hover { transform: scale(1.05); opacity: 0.9; }

        .btn-ghost {
            border: 1px solid #777a88; color: var(--color-quartz);
            padding: 12px 24px; border-radius: 9999px;
            text-decoration: none; margin-left: 15px; transition: 0.3s;
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.1); }

        /* Secciones */
        section { padding: 80px 10%; max-width: 1200px; margin: 0 auto; }
        .section-label { color: var(--color-ash); font-size: 12px; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 10px; display: block; }
        h2 { font-family: 'Figtree', sans-serif; font-size: 36px; margin-bottom: 30px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .card {
            background: var(--color-abyss); border: 1px solid var(--color-obsidian-edge);
            border-radius: 12px; padding: 24px; transition: 0.3s;
        }
        .card:hover { background: var(--color-deep-sea); transform: translateY(-5px); box-shadow: 0 4px 30px rgba(0,0,0,0.5); }

        footer {
            background: var(--color-void); padding: 40px 10%;
            border-top: 1px solid var(--color-obsidian-edge);
            text-align: center; color: var(--color-ash); font-size: 13px;
        }

        @media (max-width: 768px) { .hero h1 { font-size: 40px; } .nav-links { display: none; } }
    </style>
</head>
<body>

        </div>
    </nav>
